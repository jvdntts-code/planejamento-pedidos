name: NEXO - validação de código

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Conferir sintaxe
        run: python -m compileall -q app.py line_analysis_v2.py management_dashboard.py brand_identity.py stock_projection.py sellout_module.py pendencias_module.py orders_module.py tasks_module.py auth_module.py
      - name: Testar métricas gerenciais
        run: python -m unittest discover -s tests -v
